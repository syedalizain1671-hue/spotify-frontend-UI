<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify-web Player Music For Everyone</title>
    <link rel="icon" href="logo/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <!-- navbar -->
    <header>
        <nav>
            <!-- Navbar left side -->
            <div class="nav_left">
                <img class="invert hamburger" src="logo/hamburger.png" alt="">
                <div class="logo">
                    <img src="logo/logo.jpg" alt="">
                </div>
                <!-- Home button and search bar -->
                <div class="home">
                    <button>
                        <img src="logo/home.png" alt="">
                    </button>
                    <b>Home</b>
                </div>
            </div>

            <!-- Navbar right side -->
            <div class="nav_right">
                <div class="install">
                    <button>Install App</button>
                </div>
                <div class="sign">
                    <button>Sign up</button>
                </div>
                <div class="log">
                    <button><b>Log in</b></button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Hero section -->
    <section>
        <div class="container">
            <div class="left">
                <div class="close">
                    <img class="invert" src="logo/cross.png" alt="">
                </div>
                <div class="library">
                    <img class="pic" src="logo/library.png" alt="">
                    <b>Your Library</b>
                    <!-- <button>
                        <img src="logo/plus.png" alt="">
                    </button> -->
                </div>

                <div class="songList">
                    <ul>

                    </ul>
                </div>


                <div class="information">
                    <ul>
                        <li><button>Legal</button></li>
                        <li><button>Saftey & Privacy Center</button></li>
                        <li><button>Privacy Policy</button></li>
                        <li><button>Cookies</button></li>
                        <li><button>About Us</button></li>
                        <li><button>Accessibility</button></li>
                        <!-- <button>🌐 English</button> -->
                    </ul>

                </div>
            </div>

            <!-- Right Box start here -->

            <div class="spotifyPlaylist">
                <h1>Spotify Playlists</h1>
                <div class="cardContainer">

                </div>
                <div class="playbox">
                    <div class="seekbar">
                        <div class="circle">

                        </div>
                    </div>
                    <div class="songinfo">

                    </div>
                    <div class="songbuttons">
                        <img id="previous" src="logo/previous.png" alt="">
                        <img id="play" src="logo/play.png" alt="">
                        <img id="next" src="logo/forward.png" alt="">
                    </div>

                    <div class="timevol">
                        <div class="songtime">

                        </div>

                        <div class="volume">
                            <img src="logo/volume.png" alt="">
                            <div class="range">
                                <input type="range" name="volume">
                            </div>
                        </div>
                    </div>
                </div>
            </div>


        </div>
    </section>
    <script src="script.js"></script>
</body>

</html>
